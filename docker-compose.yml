services:
  postgres:
    image: postgres:latest
    container_name: Witcher
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: WitcherSchema
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/liquibase/changelog:/docker-entrypoint-initdb.d

volumes:
  postgres_data: