spring:
  application:
    name: witcherboard
  datasource:
    url: jdbc:postgresql://localhost:5432/witcherboard
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:/db/liquibase/changelog/changelog-master.yaml
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 3600000